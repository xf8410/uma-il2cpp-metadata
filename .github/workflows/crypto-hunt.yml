name: crypto-hunt

# 用已解密的 libil2cpp 反汇编加解密方法，抽 key/IV（目标名单见 dump/crypto_targets.tsv）
on:
  push:
    paths:
      - '.github/workflows/crypto-hunt.yml'
      - 'tools/hunt_crypto.py'
      - 'metadata-*/dump/crypto_targets.tsv'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet capstone
      - name: 准备文件
        run: |
          : > hunt.log
          G=$(ls metadata-*/libil2cpp.dec.so.gz 2>/dev/null | head -1)
          gunzip -c "$G" > dec.so
          ls -l dec.so >> hunt.log
          R=$(ls metadata-*/dump/methods_rva.tsv 2>/dev/null | head -1)
          T=$(ls metadata-*/dump/crypto_targets.tsv 2>/dev/null | head -1)
          echo "rva     = $R" >> hunt.log
          echo "targets = $T" >> hunt.log
          echo "RVA=$R" >> "$GITHUB_ENV"
          echo "TARGETS=$T" >> "$GITHUB_ENV"
      - name: 反汇编加解密方法
        run: |
          rm -rf crypto-hunt
          python3 tools/hunt_crypto.py dec.so "$RVA" "$TARGETS" crypto-hunt >> hunt.log 2>&1 || true
          ls -l crypto-hunt >> hunt.log 2>&1 || true
      - name: 提交
        if: always()
        run: |
          [ -f hunt.log ] || echo "(无)" > hunt.log
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp hunt.log crypto-hunt.txt
          git add crypto-hunt.txt crypto-hunt || true
          git commit -m "ci: crypto hunt" || echo "no change"
          git push || true