name: blackbox-build

# 克隆 ALEX5402/NewBlackbox → 打补丁 → JDK21 + NDK29 编译 → 发 Release
# 本轮补丁（除之前的中文化/日志）：
#   ★ WebView 修复：guest 里创建 WebView 时，把 Context 换成宿主 Context，
#     这样 Chromium 的 app_webview* 数据目录会落在真实可写的宿主路径下。
#     （实测根因：容器数据目录里从来没有 app_webview*，导致所有页面 ERR_CACHE_MISS）
on:
  push:
    paths:
      - '.github/workflows/blackbox-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉源码 + 装 NDK
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; : > "$LOG"
          UP="$GITHUB_WORKSPACE/upstream"
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$UP" >> "$LOG" 2>&1
          echo "commit: $(git -C "$UP" rev-parse --short HEAD)" >> "$LOG"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >> "$LOG" 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "platforms;android-36" >> "$LOG" 2>&1 || echo "sdkmanager 部分失败（继续）" >> "$LOG"

      - name: 打补丁
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          python3 - "$GITHUB_WORKSPACE/upstream" >> "$LOG" 2>&1 <<'PY'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])

          # ---------- 1) WebView 用宿主 Context ----------
          wv = root / "Bcore/src/main/java/top/niunaijun/blackbox/fake/service/WebViewProxy.java"
          s = wv.read_text(encoding="utf-8")
          anchor = ("                if (args != null && args.length > 0 && args[0] instanceof Context) {\n"
                    "                    context = (Context) args[0];")
          assert anchor in s, "WebViewProxy 锚点没找到"
          new = anchor + ("\n                    Context __host = BlackBoxCore.getContext();\n"
                          "                    if (__host != null) {\n"
                          "                        args[0] = __host;\n"
                          "                        context = __host;\n"
                          "                        Slog.d(TAG, \"WebView: context swapped to host for data dir\");\n"
                          "                    }")
          s = s.replace(anchor, new, 1)
          wv.write_text(s, encoding="utf-8")
          print("OK WebViewProxy：guest Context -> 宿主 Context")

          # ---------- 2) AppsRepository：日志 + 中文报错（同前） ----------
          repo = root / "app/src/main/java/top/niunaijun/blackboxa/data/AppsRepository.kt"
          t = repo.read_text(encoding="utf-8")
          for old, nw in [
              ('Log.e(TAG, "Error installing APK: ${e.message}")', 'Log.e(TAG, "Error installing APK", e)'),
              ('Log.e(TAG, "Error in previewInstallList: ${e.message}")', 'Log.e(TAG, "Error in previewInstallList", e)'),
              ('resultLiveData.postValue("Installation failed: ${e.message}")',
               'resultLiveData.postValue("安装失败：${e.message}")'),
          ]:
              if old in t:
                  t = t.replace(old, nw)
              else:
                  print("跳过:", old[:40])
          repo.write_text(t, encoding="utf-8")
          print("OK AppsRepository")

          # ---------- 3) strings.xml 中文化 ----------
          ZH = {
            "choose": "选择", "choose_app": "选择应用", "installed_app": "已安装应用",
            "installed_module": "已安装模块", "empty_empty": "空空如也", "filter": "过滤",
            "open_source_path": "开源地址", "setting": "设置", "jump_module": "前往模块管理",
            "module_setting": "模块管理", "enable_xposed": "启用 Xposed 框架",
            "hider": "隐藏", "hide_root": "隐藏 Root", "hide_xposed": "隐藏 Xposed",
            "userRemark": "备注", "done": "完成", "cancel": "取消", "no_reminders": "不再提醒",
            "app_stop": "停止运行", "app_stop_hint": "要强制停止 %s 吗？", "is_stop": "%s 已停止",
            "app_clear": "清除数据", "app_clear_hint": "要清除 %s 的数据吗？",
            "app_remove": "卸载应用", "app_shortcut": "创建快捷方式",
            "shortcut_name": "快捷方式名称", "try_add_shortcut": "已尝试添加到桌面",
            "install_success": "安装成功", "install_fail": "安装失败：%s",
            "install_fail_no_msg": "安装失败", "uninstall_success": "卸载成功",
            "uninstall_fail": "卸载失败", "uninstall_app": "卸载应用",
            "uninstall_app_hint": "要卸载 %s 吗？卸载后会清除相关数据。",
            "remove_success": "移除成功", "clear_success": "清除成功",
            "start_fail": "启动失败", "restart_module": "重启应用后生效", "other": "其他",
            "use_vpn_network": "使用 VPN 网络", "gms_manager": "GMS 管理",
          }
          sx = root / "app/src/main/res/values/strings.xml"
          tx = sx.read_text(encoding="utf-8")
          n = 0
          for k, v in ZH.items():
              pat = r'<string name="%s">.*?</string>' % re.escape(k)
              tx2, cnt = re.subn(pat, '<string name="%s">%s</string>' % (k, v), tx, count=1, flags=re.S)
              if cnt:
                  tx = tx2; n += 1
          sx.write_text(tx, encoding="utf-8")
          print("OK strings.xml 中文化 %d 条" % n)
          PY

      - name: 编译
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE/upstream"
          chmod +x gradlew
          ( ./gradlew :app:assembleDebug --no-daemon --stacktrace ) >> "$LOG" 2>&1
          echo "gradle exit=$?" >> "$LOG"

      - name: 发布
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE"
          APK=$(find upstream -name "*debug*.apk" | head -1)
          echo "APK=${APK:-none}" >> "$LOG"
          if [ -n "$APK" ]; then
            echo "输出: $(stat -c%s "$APK") B" >> "$LOG"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)" >> "$LOG"
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$APK" "bb-wvfix-$(date -u +%m%d-%H%M).apk"
            gh release upload builds bb-wvfix-*.apk -R "$GITHUB_REPOSITORY" --clobber >> "$LOG" 2>&1
            echo "发布: 完成" >> "$LOG"
          fi
          { echo "run: $GITHUB_RUN_ID  $(date -u +%FT%TZ)"; echo "--- 末尾 120 行 ---"; tail -n 120 "$LOG"; } > blackbox-build-status.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blackbox-build-status.txt || true
          git commit -m "ci: blackbox build ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true