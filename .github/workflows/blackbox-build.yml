name: blackbox-build

# 克隆 ALEX5402/NewBlackbox → 打补丁 → JDK21 + NDK29 编译 → 发 Release
# 本轮补丁：
#   1) ★ manifest 加 MANAGE_EXTERNAL_STORAGE —— 没有它，即使 appops 批准，按 uid 读 /sdcard 仍然 Permission denied
#   2) WebView 用宿主 Context 创建（容器里 app_webview 目录从未创建 → ERR_CACHE_MISS）
#   3) App.onCreate 自动导入 + 自动启动（读 /sdcard/Download/orig.apk），测试不点屏
#   4) 诊断日志 + 中文报错
on:
  push:
    paths:
      - '.github/workflows/blackbox-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 拉源码 + 装 NDK
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"; : > "$LOG"
          UP="$GITHUB_WORKSPACE/upstream"
          git clone --depth 1 https://github.com/ALEX5402/NewBlackbox.git "$UP" >> "$LOG" 2>&1
          echo "commit: $(git -C "$UP" rev-parse --short HEAD)" >> "$LOG"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >> "$LOG" 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.13846066" "platforms;android-36" >> "$LOG" 2>&1 || echo "sdkmanager 部分失败（继续）" >> "$LOG"

      - name: 打补丁
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          python3 - "$GITHUB_WORKSPACE/upstream" >> "$LOG" 2>&1 <<'PY'
          import re, sys, pathlib
          root = pathlib.Path(sys.argv[1])

          # ---------- 1) manifest 加 MANAGE_EXTERNAL_STORAGE ----------
          mf = root / "app/src/main/AndroidManifest.xml"
          m = mf.read_text(encoding="utf-8")
          if "MANAGE_EXTERNAL_STORAGE" not in m:
              anchor = '<uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"'
              assert anchor in m, "manifest 锚点没找到"
              m = m.replace(anchor,
                            '<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" />\n    ' + anchor, 1)
              mf.write_text(m, encoding="utf-8")
              print("OK manifest：加 MANAGE_EXTERNAL_STORAGE")
          else:
              print("manifest 已有 MANAGE_EXTERNAL_STORAGE")

          # ---------- 2) WebView 用宿主 Context ----------
          wv = root / "Bcore/src/main/java/top/niunaijun/blackbox/fake/service/WebViewProxy.java"
          s = wv.read_text(encoding="utf-8")
          anchor = ("                if (args != null && args.length > 0 && args[0] instanceof Context) {\n"
                    "                    context = (Context) args[0];")
          if anchor in s:
              s = s.replace(anchor, anchor + ("\n                    Context __host = BlackBoxCore.getContext();\n"
                                              "                    if (__host != null) {\n"
                                              "                        args[0] = __host;\n"
                                              "                        context = __host;\n"
                                              "                        Slog.d(TAG, \"WebView: context swapped to host\");\n"
                                              "                    }"), 1)
              wv.write_text(s, encoding="utf-8")
              print("OK WebViewProxy")
          else:
              print("WebViewProxy 锚点未命中（跳过）")

          # ---------- 3) 自动导入 + 自动启动 ----------
          app = root / "app/src/main/java/top/niunaijun/blackboxa/app/App.kt"
          a = app.read_text(encoding="utf-8")
          old = "            AppManager.doOnCreate(mContext)"
          auto = (
            "            Thread {\n"
            "                try {\n"
            "                    Thread.sleep(3000)\n"
            "                    val g = java.io.File(\"/sdcard/Download/orig.apk\")\n"
            "                    val core = BlackBoxCore.get()\n"
            "                    val la = core.getInstalledApplications(0, 0)\n"
            "                    android.util.Log.i(\"BB_AUTO\", \"guest=\" + (la?.size ?: -1) + \" apkExists=\" + g.exists() + \" apkReadable=\" + g.canRead())\n"
            "                    if ((la == null || la.isEmpty()) && g.exists()) {\n"
            "                        val cache = java.io.File(cacheDir, \"guest.apk\")\n"
            "                        if (cache.exists()) cache.delete()\n"
            "                        g.inputStream().use { i -> cache.outputStream().use { o -> i.copyTo(o) } }\n"
            "                        android.util.Log.i(\"BB_AUTO\", \"copied to \" + cache.absolutePath + \" size=\" + cache.length())\n"
            "                        val r = core.installPackageAsUser(cache.absolutePath, 0)\n"
            "                        android.util.Log.i(\"BB_AUTO\", \"install ok=\" + r?.success + \" msg=\" + r?.msg)\n"
            "                    }\n"
            "                    Thread.sleep(2000)\n"
            "                    val ok = core.launchApk(\"com.bilibili.umamusu\", 0)\n"
            "                    android.util.Log.i(\"BB_AUTO\", \"launch=\" + ok)\n"
            "                } catch (t: Throwable) {\n"
            "                    android.util.Log.e(\"BB_AUTO\", \"auto failed\", t)\n"
            "                }\n"
            "            }.start()\n" + old)
          if old in a and "BB_AUTO" not in a:
              a = a.replace(old, auto, 1)
              app.write_text(a, encoding="utf-8")
              print("OK App.kt 自动导入+启动")
          else:
              print("App.kt 已打过或锚点未命中")

          # ---------- 4) strings 中文化 ----------
          ZH = {"choose": "选择", "choose_app": "选择应用", "installed_app": "已安装应用",
                "empty_empty": "空空如也", "filter": "过滤", "setting": "设置",
                "module_setting": "模块管理", "done": "完成", "cancel": "取消",
                "install_success": "安装成功", "install_fail": "安装失败：%s",
                "uninstall_success": "卸载成功", "uninstall_fail": "卸载失败", "other": "其他"}
          sx = root / "app/src/main/res/values/strings.xml"
          tx = sx.read_text(encoding="utf-8")
          n = 0
          for k, v in ZH.items():
              tx2, cnt = re.subn(r'<string name="%s">.*?</string>' % re.escape(k),
                                 '<string name="%s">%s</string>' % (k, v), tx, count=1, flags=re.S)
              if cnt:
                  tx = tx2; n += 1
          sx.write_text(tx, encoding="utf-8")
          print("OK strings %d 条" % n)
          PY

      - name: 编译
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE/upstream"
          chmod +x gradlew
          ( ./gradlew :app:assembleDebug --no-daemon --stacktrace ) >> "$LOG" 2>&1
          echo "gradle exit=$?" >> "$LOG"

      - name: 发布
        if: always()
        run: |
          LOG="$GITHUB_WORKSPACE/b.log"
          cd "$GITHUB_WORKSPACE"
          APK=$(find upstream -name "*debug*.apk" | head -1)
          echo "APK=${APK:-none}" >> "$LOG"
          if [ -n "$APK" ]; then
            echo "输出: $(stat -c%s "$APK") B" >> "$LOG"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)" >> "$LOG"
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$APK" "bb-perm-$(date -u +%m%d-%H%M).apk"
            gh release upload builds bb-perm-*.apk -R "$GITHUB_REPOSITORY" --clobber >> "$LOG" 2>&1
            echo "发布: 完成" >> "$LOG"
          fi
          { echo "run: $GITHUB_RUN_ID  $(date -u +%FT%TZ)"; echo "--- 末尾 120 行 ---"; tail -n 120 "$LOG"; } > blackbox-build-status.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add blackbox-build-status.txt || true
          git commit -m "ci: blackbox build ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true