name: il2cppdump-keys

# 用 Il2CppDumper 产生 dump.cs，grep 加解密调用点，抽 key/IV 字面量
on:
  push:
    paths:
      - '.github/workflows/il2cppdump-keys.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: 准备 so + metadata
        run: |
          : > keys.log
          G=$(ls metadata-*/libil2cpp.dec.so.gz | head -1)
          gunzip -c "$G" > dec.so
          M=$(ls metadata-*/global-metadata.fixed.dat | head -1)
          cp "$M" global-metadata.dat
          ls -l dec.so global-metadata.dat >> keys.log
      - name: 下载 Il2CppDumper（列出全部资产，选第一个 zip）
        run: |
          set -e
          curl -sS https://api.github.com/repos/Perfare/Il2CppDumper/releases/latest -o rel.json
          echo "--- assets ---" >> keys.log
          python3 -c "import json;d=json.load(open('rel.json'));print(d.get('tag_name'));[print(a['name'],a['size']) for a in d.get('assets',[])]" >> keys.log 2>&1 || true
          url=$(python3 -c "import json;d=json.load(open('rel.json'));a=[x for x in d['assets'] if x['name'].lower().endswith('.zip')];print(a[0]['browser_download_url'] if a else '')")
          echo "dumper = ${url:-<无>}" >> keys.log
          if [ -n "$url" ]; then curl -sSL -o dumper.zip "$url"; fi
          ls -l dumper.zip >> keys.log 2>&1 || true
          mkdir -p dumper && cd dumper && unzip -o -q ../dumper.zip 2>/dev/null || true
          find . -maxdepth 3 -type f | head -40 >> ../keys.log
      - name: 跑 Il2CppDumper（优先 dotnet dll）
        run: |
          cd dumper
          DLL=$(find . -name 'Il2CppDumper.dll' | head -1)
          echo "dll = ${DLL:-<无>}" >> ../keys.log
          if [ -n "$DLL" ]; then
            dotnet "$DLL" ../dec.so ../global-metadata.dat ../out >> ../keys.log 2>&1 || true
          else
            EXE=$(find . -name 'Il2CppDumper' -type f | head -1)
            echo "exe = ${EXE:-<无>}" >> ../keys.log
            if [ -n "$EXE" ]; then chmod +x "$EXE"; "$EXE" ../dec.so ../global-metadata.dat ../out >> ../keys.log 2>&1 || true; fi
          fi
          cd ..
          ls -l out 2>&1 | head -20 >> keys.log || true
          du -sh out 2>&1 >> keys.log || true
      - name: grep 加解密调用点
        run: |
          D=$(ls out/dump.cs 2>/dev/null | head -1)
          echo "--- dump.cs = ${D:-<无>} ---" >> keys.log
          if [ -n "$D" ]; then
            echo "===== DecryptRJ256 调用点 =====" >> keys.log
            grep -n -A 12 'DecryptRJ256(' "$D" | head -80 >> keys.log || true
            echo "===== CreateKey 调用点 =====" >> keys.log
            grep -n -A 8 'CreateKey(' "$D" | head -60 >> keys.log || true
            echo "===== DecryptAcb 调用点 =====" >> keys.log
            grep -n -A 12 'DecryptAcb(' "$D" | head -60 >> keys.log || true
            echo "===== RJ256 附近 =====" >> keys.log
            grep -n -B 4 -A 10 'RJ256' "$D" | head -120 >> keys.log || true
          fi
      - name: 提交
        if: always()
        run: |
          [ -f keys.log ] || echo "(无)" > keys.log
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp keys.log il2cppdump-keys.txt
          git add il2cppdump-keys.txt || true
          git commit -m "ci: il2cppdump keys" || echo "no change"
          git push || true