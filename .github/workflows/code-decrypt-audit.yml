name: code-decrypt-audit

# 代码解密审计：对已解密的 libil2cpp 跑 verify_code，找出仍未解开的页
on:
  push:
    paths:
      - '.github/workflows/code-decrypt-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet capstone
      - name: 准备 SO
        run: |
          : > aud.log
          G=$(ls metadata-*/libil2cpp.dec.so.gz 2>/dev/null | head -1)
          echo "dec.so.gz = ${G:-<无>}" >> aud.log
          if [ -n "$G" ]; then gunzip -c "$G" > dec.so; fi
          [ -f dec.so ] || { U=$(ls metadata-*/libil2cpp.so.gz | head -1); gunzip -c "$U" > dec.so; }
          ls -l dec.so >> aud.log
          R=$(ls metadata-*/dump-fixed/methods_rva.tsv metadata-*/dump/methods_rva.tsv 2>/dev/null | head -1)
          # verify_code.py 的接口是 3 参：<so> <global-metadata.fixed.dat> <methods_rva.tsv>
          # （第 2 参当前脚本体里没被读取，但缺了就 IndexError: sys.argv[3]）
          M=$(ls metadata-*/global-metadata.fixed.dat metadata-*/dump-fixed/global-metadata.fixed.dat 2>/dev/null | head -1)
          echo "rva  = ${R:-<无>}" >> aud.log
          echo "meta = ${M:-<无>}" >> aud.log
          echo "RVA=$R" >> "$GITHUB_ENV"
          echo "META=$M" >> "$GITHUB_ENV"
      - name: 脚本接口
        run: head -30 tools/verify_code.py >> aud.log 2>&1
      - name: 跑 verify（3 参）
        run: |
          python3 tools/verify_code.py dec.so "$META" "$RVA" > aud.out 2>&1 || true
          tail -c 6000 aud.out >> aud.log
          P=$(ls metadata-*/dump*/code_xor97_pages.txt metadata-*/code_xor97_pages.txt 2>/dev/null | head -1)
          echo "--- code_xor97_pages.txt = ${P:-<无>} ---" >> aud.log
          if [ -n "$P" ]; then
            echo "区间条数：$(grep -c '^0x' "$P" || true)" >> aud.log
            head -20 "$P" >> aud.log
          fi
      - name: 统计 ret（按字节数，ARM64 小端 c0 03 5f d6）
        run: |
          python3 -c "d=open('dec.so','rb').read(); print('--- ARM64 ret 小端 c0 03 5f d6 次数 ---'); print(d.count(bytes.fromhex('c0035fd6')))" >> aud.log 2>&1 || true
          python3 -c "d=open('dec.so','rb').read(); print('--- 对照：反序 d6 5f 03 c0 次数（旧写法搜的是这个，必然≈0）---'); print(d.count(bytes.fromhex('d65f03c0')))" >> aud.log 2>&1 || true
      - name: 提交
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f aud.log ] || echo "(无)" > aud.log
          cp aud.log code-decrypt-audit-status.txt
          git add code-decrypt-audit-status.txt || true
          git commit -m "ci: code decrypt audit" || echo "no change"
          git push || true