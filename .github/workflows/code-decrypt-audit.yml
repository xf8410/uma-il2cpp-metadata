name: code-decrypt-audit

# 代码解密审计：对已解密的 libil2cpp 跑 verify_code，找出仍未解开的页
on:
  push:
    paths:
      - '.github/workflows/code-decrypt-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --quiet capstone
      - name: 准备 SO
        run: |
          : > aud.log
          G=$(ls metadata-*/libil2cpp.dec.so.gz 2>/dev/null | head -1)
          echo "dec.so.gz = ${G:-<无>}" >> aud.log
          if [ -n "$G" ]; then gunzip -c "$G" > dec.so; fi
          [ -f dec.so ] || { U=$(ls metadata-*/libil2cpp.so.gz | head -1); gunzip -c "$U" > dec.so; }
          ls -l dec.so >> aud.log
          R=$(ls metadata-*/dump-fixed/methods_rva.tsv metadata-*/dump/methods_rva.tsv 2>/dev/null | head -1)
          echo "rva = ${R:-<无>}" >> aud.log
          echo "RVA=$R" >> $GITHUB_ENV
      - name: 脚本接口
        run: |
          head -30 tools/verify_code.py >> aud.log 2>&1
      - name: 跑 verify
        run: |
          python3 tools/verify_code.py dec.so "$RVA" > aud.out 2>&1 || true
          tail -c 6000 aud.out >> aud.log
      - name: 统计
        run: |
          echo "--- dec.so 中 0xD65F03C0(ret) 出现次数 ---" >> aud.log
          od -An -tx1 -v dec.so | tr -d ' \n' | grep -o "d65f03c0" | wc -l >> aud.log || true
      - name: 提交
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f aud.log ] || echo "(无)" > aud.log
          cp aud.log code-decrypt-audit-status.txt
          git add code-decrypt-audit-status.txt || true
          git commit -m "ci: code decrypt audit" || echo "no change"
          git push || true