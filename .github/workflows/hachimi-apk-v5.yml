name: hachimi-apk-v5

# 决定性实验：libmain.so = **原版字节 + 末尾 1 个字节**
# 功能完全不变（ELF 照常加载），只是文件内容/哈希变了。
#   · 若也 ~10 秒死 → 说明是完整性/哈希校验（改了 libmain 就死）
#   · 若正常运行   → 说明之前是 proxy 加载链路的问题
on:
  push:
    paths:
      - '.github/workflows/hachimi-apk-v5.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 取 APK
        run: |
          : > v5.log
          echo "READY=false" >> $GITHUB_ENV
          mkdir -p apk-dl
          gh release download -R "$GITHUB_REPOSITORY" -D apk-dl --pattern '*.apk' --clobber >> v5.log 2>&1 || true
          APK=$(find apk-dl -name '*.apk' | head -1 || true)
          [ -z "$APK" ] && { echo "跳过：无 APK" >> v5.log; exit 0; }
          echo "APK: $APK ($(stat -c%s "$APK") B)" >> v5.log
          echo "APK=$APK" >> $GITHUB_ENV
          echo "READY=true" >> $GITHUB_ENV

      - name: 注入（原版 libmain + 1 字节）
        if: env.READY == 'true'
        run: |
          set -e
          rm -rf work out && mkdir -p work out
          unzip -q "$APK" -d work
          cp "$APK" out/app-updated.apk
          D=work/lib/arm64-v8a
          ORIG=$(stat -c%s "$D/libmain.so")
          printf '\0' >> "$D/libmain.so"
          NEW=$(stat -c%s "$D/libmain.so")
          {
            echo "libmain.so 原始: $ORIG B"
            echo "libmain.so 现在: $NEW B（末尾多 1 字节，功能不变）"
            echo "sha256 原 : $(head -c "$ORIG" "$D/libmain.so" | sha256sum | cut -d' ' -f1)"
            echo "sha256 新 : $(sha256sum "$D/libmain.so" | cut -d' ' -f1)"
          } >> v5.log
          ( cd work && zip -q -0 ../out/app-updated.apk lib/arm64-v8a/libmain.so )

      - name: 对齐 + 签名
        if: env.READY == 'true'
        run: |
          set -e
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$ZA" -p -f 4 out/app-updated.apk out/app-aligned.apk
          keytool -genkeypair -v -keystore v5.jks -alias v5 -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass v5pass -keypass v5pass \
            -dname "CN=V5,OU=Uma,O=DSH,L=NA,S=NA,C=JP" > /dev/null 2>&1
          NAME=$(basename "$APK" .apk)
          "$AS" sign --ks v5.jks --ks-pass pass:v5pass --key-pass pass:v5pass \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "out/${NAME}-v5.apk" out/app-aligned.apk
          "$AS" verify "out/${NAME}-v5.apk" > /dev/null && echo "签名: ok" >> v5.log
          {
            echo "输出: out/${NAME}-v5.apk ($(stat -c%s "out/${NAME}-v5.apk") B)"
            echo "sha256: $(sha256sum "out/${NAME}-v5.apk" | cut -d' ' -f1)"
            echo "结果: 成功"
          } >> v5.log
          echo "OUT_APK=out/${NAME}-v5.apk" >> $GITHUB_ENV

      - name: 上传 artifact
        if: env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hachimi-patched-apk-v5
          path: ${{ env.OUT_APK }}
          retention-days: 14
          compression-level: 0

      - name: 提交状态
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f v5.log ] || echo "(无)" > v5.log
          cp v5.log hachimi-apk-v5-status.txt
          git add hachimi-apk-v5-status.txt
          git commit -m "ci: hachimi-apk-v5 status ($GITHUB_RUN_ID)" || echo "no change"
          git push || true