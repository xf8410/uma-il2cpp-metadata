name: il2cpp-dump

# metadata-*/global-metadata.fixed.dat 存在就跑解析；
# 同目录下若有 libil2cpp*.gz / *.zip，自动解包、校验、ELF 概况、
# hook payload 分析、CodeRegistration 扫描、codegen module 扫描、RVA 映射。
on:
  push:
    paths:
      - 'metadata-*/global-metadata.fixed.dat'
      - 'metadata-*/**.gz'
      - 'metadata-*/**.zip'
      - 'tools/**.py'
      - '.github/workflows/dump.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 解包 libil2cpp.so
        run: |
          set -e
          for d in metadata-*/ ; do
            for z in "$d"*.zip ; do
              [ -f "$z" ] || continue
              echo "unzip: $z ($(stat -c%s "$z") B)"
              unzip -t "$z" > /dev/null
              unzip -o "$z" -d "$d"
            done
            for g in "$d"*.gz ; do
              [ -f "$g" ] || continue
              out="${g%.gz}"
              echo "gunzip: $g ($(stat -c%s "$g") B) -> $out"
              gzip -dc "$g" > "$out"
            done
          done

      - name: 校验 libil2cpp.so
        run: |
          set -e
          found=0
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            found=1
            d=$(dirname "$f")
            echo "== $f ($(stat -c%s "$f") B)"
            if [ -f "$d/libil2cpp.sha256" ]; then
              ( cd "$d" && sha256sum -c libil2cpp.sha256 )
            else
              sha256sum "$f"
            fi
          done
          [ "$found" = 1 ] && echo "so 校验完成" || echo "本仓未上传 so，跳过"

      - name: Self-check + dump (metadata)
        run: |
          set -e
          found=0
          for d in metadata-*/ ; do
            f="${d}global-metadata.fixed.dat"
            [ -f "$f" ] || continue
            found=1
            echo "::group::check $f"
            python3 tools/parse_metadata.py "$f" --check | tee "${d}dump_check.txt"
            echo "::endgroup::"
            python3 tools/parse_metadata.py "$f" "${d}dump"
          done
          [ "$found" = 1 ] || { echo "没有找到 metadata-*/global-metadata.fixed.dat"; exit 1; }

      - name: ELF 概况
        run: |
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            echo "::group::elf $f"
            python3 tools/elf_info.py "$f" | tee "$(dirname "$f")/so_check.txt"
            echo "::endgroup::"
          done

      - name: hook payload 分析（未覆盖区间）
        run: |
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            echo "::group::payload $f"
            python3 tools/payload_info.py "$f" | tee "$(dirname "$f")/so_payload.txt"
            echo "::endgroup::"
          done

      - name: CodeRegistration / methodPointers 扫描
        run: |
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            d=$(dirname "$f")
            m="$d/global-metadata.fixed.dat"
            [ -f "$m" ] || continue
            echo "::group::registration $f"
            python3 tools/find_registration.py "$f" "$m" --write-rva "$d/dump/methods_rva_global.tsv" | tee "$d/so_registration.txt"
            echo "::endgroup::"
          done

      - name: codegen module 扫描（按程序集名）
        run: |
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            d=$(dirname "$f")
            m="$d/global-metadata.fixed.dat"
            [ -f "$m" ] || continue
            echo "::group::modules $f"
            python3 tools/find_modules.py "$f" "$m" | tee "$d/so_modules.txt"
            echo "::endgroup::"
          done

      - name: RVA 映射（method index -> 代码地址）
        run: |
          for f in $(find metadata-* -maxdepth 3 -name '*.so' -type f) ; do
            d=$(dirname "$f")
            m="$d/global-metadata.fixed.dat"
            [ -f "$m" ] || continue
            echo "::group::rva $f"
            python3 tools/build_rva.py "$f" "$m" "$d/dump/methods_rva.tsv" | tee "$d/so_rva.txt"
            echo "::endgroup::"
          done

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dump: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no change"
          git push