name: il2cpp-dump

# metadata-*/global-metadata.fixed.dat 存在就跑解析；
# 同目录下若有 libil2cpp*.zip / *.so，顺带解包、校验、出 ELF 概况。
on:
  push:
    paths:
      - 'metadata-*/global-metadata.fixed.dat'
      - 'metadata-*/**.zip'
      - 'metadata-*/**.so'
      - 'tools/**.py'
      - '.github/workflows/dump.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Unpack libil2cpp.so (若以 zip 上传)
        run: |
          for d in metadata-*/ ; do
            for z in "$d"*.zip ; do
              [ -f "$z" ] || continue
              echo "unpack: $z ($(stat -c%s "$z") B)"
              python3 - "$z" "$d" <<'PY'
import sys, zipfile
z = zipfile.ZipFile(sys.argv[1])
bad = z.testzip()
if bad:
    raise SystemExit("zip 校验失败: %s" % bad)
z.extractall(sys.argv[2])
print("members:", z.namelist())
PY
            done
          done

      - name: 校验 libil2cpp.so
        run: |
          for f in metadata-*/*.so ; do
            [ -f "$f" ] || continue
            d=$(dirname "$f")
            echo "== $f  ($(stat -c%s "$f") B)"
            if [ -f "$d/libil2cpp.sha256" ]; then
              ( cd "$d" && sha256sum -c libil2cpp.sha256 )
            else
              sha256sum "$f"
              echo "（没有 libil2cpp.sha256，跳过比对）"
            fi
          done

      - name: Self-check + dump (metadata)
        run: |
          set -e
          found=0
          for d in metadata-*/ ; do
            f="${d}global-metadata.fixed.dat"
            [ -f "$f" ] || continue
            found=1
            echo "::group::check $f"
            python3 tools/parse_metadata.py "$f" --check | tee "${d}dump_check.txt"
            echo "::endgroup::"
            python3 tools/parse_metadata.py "$f" "${d}dump"
          done
          [ "$found" = 1 ] || { echo "没有找到 metadata-*/global-metadata.fixed.dat"; exit 1; }

      - name: ELF 概况
        run: |
          for f in metadata-*/*.so ; do
            [ -f "$f" ] || continue
            echo "::group::elf $f"
            python3 tools/elf_info.py "$f" | tee "$(dirname "$f")/so_check.txt"
            echo "::endgroup::"
          done

      - name: Commit results
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "dump: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "no change"
          git push