name: webview-test

# v3：换包名 com.dsh.wvtest3，避开容器里残留的旧签名副本。
# 同时打「网络状态」「裸 HTTP 请求」「WebView 加载」三类日志：
#   · HTTP 通、WebView 失败 ⇒ 容器里坏的是 Chromium（WebView 内核）
#   · HTTP 也不通            ⇒ 容器的网络代理坏（ConnectivityManager 等）
on:
  push:
    paths:
      - '.github/workflows/webview-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 生成工程
        run: |
          : > w.log
          mkdir -p proj/app/src/main/java/com/dsh/wvtest3
          cd proj
          cat > settings.gradle <<'G'
          rootProject.name = "wvtest3"
          include ':app'
          G
          cat > build.gradle <<'G'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies { classpath 'com.android.tools.build:gradle:8.7.3' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          G
          cat > app/build.gradle <<'G'
          apply plugin: 'com.android.application'
          android {
              namespace 'com.dsh.wvtest3'
              compileSdk 36
              defaultConfig {
                  applicationId 'com.dsh.wvtest3'
                  minSdk 24
                  targetSdk 36
                  versionCode 3
                  versionName '3.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          G
          cat > app/src/main/AndroidManifest.xml <<'G'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <application android:label="WVTest3" android:usesCleartextTraffic="true">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          G
          cat > app/src/main/java/com/dsh/wvtest3/MainActivity.java <<'G'
          package com.dsh.wvtest3;

          import android.app.Activity;
          import android.content.Context;
          import android.graphics.Color;
          import android.net.ConnectivityManager;
          import android.net.Network;
          import android.net.NetworkCapabilities;
          import android.net.NetworkInfo;
          import android.os.Bundle;
          import android.util.Log;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.view.ViewGroup;

          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;

          public class MainActivity extends Activity {
              private static final String TAG = "WVTest3";

              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  Log.i(TAG, "onCreate start");

                  try {
                      ConnectivityManager cm = (ConnectivityManager) getSystemService(Context.CONNECTIVITY_SERVICE);
                      NetworkInfo ni = cm.getActiveNetworkInfo();
                      Log.i(TAG, "netInfo=" + (ni == null ? "null" :
                              ("type=" + ni.getTypeName() + " connected=" + ni.isConnected() + " state=" + ni.getState())));
                      Network n = cm.getActiveNetwork();
                      Log.i(TAG, "activeNetwork=" + n);
                      if (n != null) {
                          NetworkCapabilities nc = cm.getNetworkCapabilities(n);
                          Log.i(TAG, "caps=" + nc);
                      }
                  } catch (Throwable t) {
                      Log.e(TAG, "netInfo error", t);
                  }

                  new Thread(() -> {
                      try {
                          HttpURLConnection c = (HttpURLConnection) new URL("https://example.com/").openConnection();
                          c.setConnectTimeout(8000);
                          c.setReadTimeout(8000);
                          c.setRequestProperty("User-Agent", "wvtest3");
                          int code = c.getResponseCode();
                          InputStream in = code >= 400 ? c.getErrorStream() : c.getInputStream();
                          int n = 0;
                          if (in != null) {
                              byte[] buf = new byte[4096];
                              int r;
                              while ((r = in.read(buf)) > 0) n += r;
                              in.close();
                          }
                          Log.i(TAG, "HTTP code=" + code + " bytes=" + n);
                      } catch (Throwable t) {
                          Log.e(TAG, "HTTP failed: " + t.getClass().getSimpleName() + " " + t.getMessage());
                      }
                  }).start();

                  WebView wv = new WebView(this);
                  WebSettings s = wv.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setBlockNetworkLoads(false);
                  wv.setBackgroundColor(Color.WHITE);
                  wv.setWebViewClient(new WebViewClient() {
                      @Override public void onPageFinished(WebView v, String url) {
                          Log.i(TAG, "onPageFinished " + url);
                      }
                      @Override public void onReceivedError(WebView v, int code, String desc, String url) {
                          Log.e(TAG, "onReceivedError code=" + code + " desc=" + desc + " url=" + url);
                      }
                  });
                  setContentView(wv, new ViewGroup.LayoutParams(
                          ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT));
                  wv.loadUrl("https://example.com/");
                  Log.i(TAG, "loadUrl issued");
              }
          }
          G
          echo "工程生成完毕" >> ../w.log

      - name: 编译
        run: |
          cd proj
          curl -sSL -o /tmp/g.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip >> ../w.log 2>&1
          unzip -q /tmp/g.zip -d /tmp >> ../w.log 2>&1
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >> ../w.log 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >> ../w.log 2>&1 || true
          ( /tmp/gradle-8.9/bin/gradle :app:assembleDebug --no-daemon ) >> ../w.log 2>&1
          echo "gradle exit=$?" >> ../w.log

      - name: 发布
        if: always()
        run: |
          cd "$GITHUB_WORKSPACE"
          APK=$(find proj -name "*debug*.apk" | head -1)
          echo "APK=${APK:-none}" >> w.log
          if [ -n "$APK" ]; then
            echo "输出: $(stat -c%s "$APK") B" >> w.log
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)" >> w.log
            gh release view builds -R "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
              gh release create builds -R "$GITHUB_REPOSITORY" --title "构建产物" --notes "测试 APK" || true
            cp "$APK" "wvtest3-$(date -u +%m%d-%H%M).apk"
            gh release upload builds wvtest3-*.apk -R "$GITHUB_REPOSITORY" --clobber >> w.log 2>&1
            echo "发布: 完成" >> w.log
          fi
          { echo "run: $GITHUB_RUN_ID  $(date -u +%FT%TZ)"; echo "--- 末尾 60 行 ---"; tail -n 60 w.log; } > webview-test-status.txt
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add webview-test-status.txt || true
          git commit -m "ci: webview test ($GITHUB_RUN_ID)" || echo "no change"
          git pull --rebase --autostash >> /dev/null 2>&1 || true
          git push || { sleep 5; git pull --rebase --autostash >> /dev/null 2>&1 || true; git push; } || true