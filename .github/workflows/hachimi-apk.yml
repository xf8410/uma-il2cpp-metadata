name: hachimi-apk

# 输入来源（优先级从高到低，全部自动）：
#   APK     : apk-*/*.apk  →  本仓 Release 里的 *.apk 附件
#   Hachimi : 仓库里已有的 libhachi*.so / libmain.so
#             →  上游 Hachimi-Hachimi/Hachimi-Unity2020 最新 release（自动下载+解压）
#
# 输出：Actions artifact `hachimi-patched-apk`（zipalign + 自签名，可直接安装）
# 注意：签名变了 → 安装前先卸载原版；每次游戏更新重跑一次。
on:
  push:
    paths:
      - 'apk-*/**'
      - 'hachimi*/**'
      - '.github/workflows/hachimi-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 定位 / 下载输入
        run: |
          echo "READY=false" >> $GITHUB_ENV

          # ---- 1) 游戏 APK ----
          APK=$(find apk-* -maxdepth 2 -name '*.apk' -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            echo "本地无 APK，尝试从本仓 Release 附件下载…"
            mkdir -p apk-dl
            gh release download -R "$GITHUB_REPOSITORY" -D apk-dl --pattern '*.apk' --clobber 2>&1 | tail -3 || true
            APK=$(find apk-dl -name '*.apk' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "::warning::没有 APK：请把它作为本仓 Release 附件上传（网页 Draft a new release），或放进 apk-*/"
            exit 0
          fi
          echo "APK=$APK" >> $GITHUB_ENV
          echo "APK: $APK ($(stat -c%s "$APK") B)"

          # ---- 2) Hachimi 本体 ----
          HACHI=$(find . -path ./.git -prune -o -iname 'libhachi*.so' -print 2>/dev/null | head -1 || true)
          MAIN=$(find . -path ./.git -prune -o -iname 'libmain.so' -print 2>/dev/null | head -1 || true)
          if [ -z "$HACHI" ] || [ -z "$MAIN" ]; then
            echo "本地无 Hachimi，从上游 release 下载…"
            mkdir -p hachimi-dl
            for REPO in Hachimi-Hachimi/Hachimi-Unity2020 UmamusumeResponseAnalyzer/Hachimi-Unity2020; do
              echo "--- try $REPO"
              gh release download -R "$REPO" -D hachimi-dl --pattern '*' --clobber 2>&1 | tail -3 || true
              ls -la hachimi-dl || true
            done
            mkdir -p hachimi-dl/unpack
            for f in hachimi-dl/* ; do
              [ -f "$f" ] || continue
              case "$f" in
                *.zip) unzip -o -q "$f" -d hachimi-dl/unpack 2>/dev/null || true ;;
                *.tar.gz|*.tgz) tar xzf "$f" -C hachimi-dl/unpack 2>/dev/null || true ;;
                *.7z) 7z x -y "$f" -ohachimi-dl/unpack >/dev/null 2>&1 || true ;;
              esac
            done
            echo "--- 下载/解压后找到的 .so："
            find hachimi-dl -iname '*.so' 2>/dev/null | head -20 || true
            HACHI=$(find hachimi-dl -iname 'libhachi*.so' 2>/dev/null | head -1 || true)
            MAIN=$(find hachimi-dl -iname 'libmain.so' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$HACHI" ] || [ -z "$MAIN" ]; then
            echo "::warning::没拿到 Hachimi 的 libhachimi*.so / libmain.so，跳过"
            echo "READY=false" >> $GITHUB_ENV
            exit 0
          fi
          echo "HACHI=$HACHI" >> $GITHUB_ENV
          echo "MAIN=$MAIN" >> $GITHUB_ENV
          echo "READY=true" >> $GITHUB_ENV
          echo "hachimi: $HACHI"; echo "libmain: $MAIN"
          file "$HACHI" "$MAIN" || true

      - name: 解包并注入
        if: env.READY == 'true'
        run: |
          set -e
          rm -rf work out && mkdir -p work out
          unzip -q "$APK" -d work
          echo "--- 原版 lib 目录："
          ls work/lib/ 2>/dev/null || true
          MAINPATH=$(find work/lib -name 'libmain.so' | head -1)
          if [ -z "$MAINPATH" ]; then echo "::error::APK 里没有 lib/*/libmain.so"; exit 1; fi
          ABI_DIR=$(dirname "$MAINPATH")
          echo "目标 ABI 目录: $ABI_DIR"
          cp "$MAIN" "$ABI_DIR/libmain.so"
          cp "$HACHI" "$ABI_DIR/$(basename "$HACHI")"
          ls -l "$ABI_DIR"

      - name: 重新打包 + 对齐
        if: env.READY == 'true'
        run: |
          set -e
          ( cd work && zip -q -r -n .arsc:.so ../out/app-unsigned.apk . )
          ls -l out/
          ZIPALIGN=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          echo "zipalign: $ZIPALIGN"
          "$ZIPALIGN" -p -f 4 out/app-unsigned.apk out/app-aligned.apk
          "$ZIPALIGN" -c -p -v 4 out/app-aligned.apk > /dev/null && echo "对齐校验通过"

      - name: 生成签名并签名
        if: env.READY == 'true'
        run: |
          set -e
          keytool -genkeypair -v -keystore dsh.keystore -alias dsh -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass dshpass -keypass dshpass \
            -dname "CN=DSH, OU=Uma, O=DSH, L=NA, S=NA, C=JP" > /dev/null 2>&1
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          APK_NAME=$(basename "$APK" .apk)
          "$APKSIGNER" sign --ks dsh.keystore --ks-pass pass:dshpass \
            --key-pass pass:dshpass --v2-signing-enabled true --v3-signing-enabled true \
            --out "out/${APK_NAME}-hachimi.apk" out/app-aligned.apk
          "$APKSIGNER" verify --print-certs "out/${APK_NAME}-hachimi.apk" | head -6
          ls -l out/
          echo "OUT_APK=out/${APK_NAME}-hachimi.apk" >> $GITHUB_ENV

      - name: 结果摘要
        if: always()
        run: |
          {
            echo "## Hachimi APK 注入"
            echo ""
            if [ "$READY" = "true" ]; then
              echo "✅ 注入完成"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 原版 APK | \`$APK\` |"
              echo "| 注入版 | \`$OUT_APK\` |"
              echo "| libhachimi | \`$HACHI\` |"
              echo "| libmain | \`$MAIN\` |"
              echo ""
              echo "安装：先卸载原版（签名不同），再装注入版。"
            else
              echo "⏭ 已跳过：缺输入。"
              echo ""
              echo "APK 请上传为本仓 **Release 附件**（网页 Draft a new release → 附加 .apk），"
              echo "Hachimi 会自动从上游 release 下载。"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: 上传 artifact
        if: env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hachimi-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 14
          compression-level: 0