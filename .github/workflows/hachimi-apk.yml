name: hachimi-apk

# 无 root 注入，按官方 Manual install：
#   原版 lib/<abi>/libmain.so → libmain_orig.so（保留）
#   proxy  libmain-<abi>.so   → libmain.so
# 注意：
#   · proxy 必须来自**同一个 release**，不同 release 的 proxy 不能混用；
#   · Zygisk 模块（module.prop 那套）里只有 libhachimi.so，那是给面具用的，
#     **不能**塞进 APK——proxy 是自带 hachimi 的（体积 ~15-25MB 能看出来）；
#   · 打包用「原地替换 entry」而不是全量重压，避免 APK 从 251MB 涨到 511MB。
on:
  push:
    paths:
      - 'apk-*/**'
      - 'hachimi*/**'
      - 'keystore/**'
      - '.github/workflows/hachimi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 取 APK
        run: |
          : > status.log
          echo "READY=false" >> $GITHUB_ENV
          echo "run: $GITHUB_RUN_ID ($GITHUB_SHA)  $(date -u +%FT%TZ)" >> status.log
          APK=$(find apk-* -maxdepth 2 -name '*.apk' -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            mkdir -p apk-dl
            gh release download -R "$GITHUB_REPOSITORY" -D apk-dl --pattern '*.apk' --clobber >> status.log 2>&1 || true
            APK=$(find apk-dl -name '*.apk' 2>/dev/null | head -1 || true)
          fi
          [ -z "$APK" ] && { echo "结果: 跳过（无 APK）" >> status.log; exit 0; }
          echo "APK: $APK ($(stat -c%s "$APK") B)" >> status.log
          echo "APK=$APK" >> $GITHUB_ENV

      - name: 取 proxy 库（单一来源）
        run: |
          mkdir -p libs/edge libs/upstream
          gh release download -R kairusds/Hachimi-Edge -D libs/edge --pattern '*' --clobber >> status.log 2>&1 || true
          gh release download -R Hachimi-Hachimi/Hachimi -D libs/upstream --pattern '*' --clobber >> status.log 2>&1 || true
          for t in libs/edge libs/upstream ; do
            for f in "$t"/* ; do
              [ -f "$f" ] || continue
              case "$f" in
                *.zip) unzip -o -q "$f" -d "$t/unpack" 2>/dev/null || true ;;
                *.tar.gz|*.tgz) tar xzf "$f" -C "$t" 2>/dev/null || true ;;
              esac
            done
          done
          {
            echo "edge 候选：";     find libs/edge -iname 'libmain-*.so' 2>/dev/null
            echo "upstream 候选："; find libs/upstream -iname 'libmain-*.so' 2>/dev/null
          } >> status.log

          # 单一来源：优先 edge（文档推荐，CN/Unity2020 支持），否则 upstream
          SRC=""
          for t in libs/edge libs/upstream ; do
            if find "$t" -iname 'libmain-arm64-v8a.so' | grep -q . ; then SRC="$t"; break; fi
          done
          [ -z "$SRC" ] && { echo "结果: 跳过（两处都没有 proxy）" >> status.log; exit 0; }
          echo "选用来源: $SRC" >> status.log
          for a in arm64-v8a armeabi-v7a ; do
            f=$(find "$SRC" -iname "libmain-${a}.so" | head -1 || true)
            echo "  $a: ${f:-<该来源没有>}" >> status.log
            if [ -n "$f" ]; then echo "P_$(echo $a | tr -d -)=$f" >> $GITHUB_ENV ; fi
          done
          P_ARM=$(find "$SRC" -iname 'libmain-arm64-v8a.so' | head -1)
          file "$P_ARM" >> status.log || true
          echo "READY=true" >> $GITHUB_ENV

      - name: 注入（原地替换 entry）
        if: env.READY == 'true'
        run: |
          set -e
          rm -rf work out && mkdir -p work out
          unzip -q "$APK" -d work
          cp "$APK" out/app-updated.apk
          ENTRIES=""
          for d in work/lib/*/ ; do
            [ -f "$d/libmain.so" ] || continue
            ABI=$(basename "$d")
            case "$ABI" in
              arm64-v8a)   PROXY="${P_arm64v8a:-}" ;;
              armeabi-v7a) PROXY="${P_armeabiv7a:-}" ;;
              *)           PROXY="" ;;
            esac
            if [ -z "$PROXY" ]; then echo "  $ABI: 该来源无 proxy，保持原样" >> status.log; continue; fi
            mv "$d/libmain.so" "$d/libmain_orig.so"
            cp "$PROXY" "$d/libmain.so"
            ENTRIES="$ENTRIES lib/$ABI/libmain.so lib/$ABI/libmain_orig.so"
            echo "  $ABI: proxy=$(basename "$PROXY") $(stat -c%s "$PROXY") B" >> status.log
          done
          [ -z "$ENTRIES" ] && { echo "::error::没有任何 ABI 注入"; exit 1; }
          echo "替换 entries:$ENTRIES" >> status.log
          ( cd work && zip -q -0 ../out/app-updated.apk $ENTRIES )
          {
            echo "原 APK 大小: $(stat -c%s "$APK") B"
            echo "替换后大小 : $(stat -c%s out/app-updated.apk) B"
          } >> status.log

      - name: 对齐 + 签名
        if: env.READY == 'true'
        run: |
          set -e
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$ZA" -p -f 4 out/app-updated.apk out/app-aligned.apk
          "$ZA" -c -p 4 out/app-aligned.apk > /dev/null && echo "zipalign: ok" >> status.log

          KS=keystore/dsh.jks
          if [ -f "$KS" ]; then
            KSPASS=$(cat keystore/pass.txt 2>/dev/null || echo dshpass)
            KEYPASS=$(cat keystore/keypass.txt 2>/dev/null || echo "$KSPASS")
            ALIAS=$(cat keystore/alias.txt 2>/dev/null || echo dsh)
            echo "keystore: 仓库内固定 key（可覆盖更新）" >> status.log
          else
            KS=dsh-temp.jks; KSPASS=dshpass; KEYPASS=dshpass; ALIAS=dsh
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KSPASS" -keypass "$KEYPASS" \
              -dname "CN=DSH,OU=Uma,O=DSH,L=NA,S=NA,C=JP" > /dev/null 2>&1
            echo "keystore: 临时生成（签名每次变，不能覆盖更新）" >> status.log
          fi
          NAME=$(basename "$APK" .apk)
          "$AS" sign --ks "$KS" --ks-pass "pass:$KSPASS" --key-pass "pass:$KEYPASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "out/${NAME}-hachimi.apk" out/app-aligned.apk
          "$AS" verify --print-certs "out/${NAME}-hachimi.apk" | head -4 >> status.log
          {
            echo "输出: out/${NAME}-hachimi.apk ($(stat -c%s "out/${NAME}-hachimi.apk") B)"
            echo "sha256: $(sha256sum "out/${NAME}-hachimi.apk" | cut -d' ' -f1)"
            echo "结果: 成功"
          } >> status.log
          echo "OUT_APK=out/${NAME}-hachimi.apk" >> $GITHUB_ENV

      - name: 上传 artifact
        if: env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hachimi-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 14
          compression-level: 0

      - name: 提交状态
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f status.log ] || echo "(无状态)" > status.log
          cp status.log hachimi-apk-status.txt
          git add hachimi-apk-status.txt
          git commit -m "ci: hachimi-apk status ($GITHUB_RUN_ID)" || echo "no change"
          git push || true