name: hachimi-apk

# 无 root 注入（按 Hachimi 官方 Manual install 流程）：
#   1) 原版 lib/<abi>/libmain.so  →  改名 libmain_orig.so
#   2) proxy 库 libmain-<abi>.so  →  复制为 lib/<abi>/libmain.so
#   3) 一并放入 libhachimi*.so
#
# 输入（自动取）：
#   APK   : apk-*/*.apk  →  本仓 Release 里的 *.apk
#   proxy : 仓库里已有的 libmain-*.so / libhachi*.so
#           →  kairusds/Hachimi-Edge、Hachimi-Hachimi/Hachimi 最新 release
#
# 输出：artifact `hachimi-patched-apk` + 仓库文件 `hachimi-apk-status.txt`
on:
  push:
    paths:
      - 'apk-*/**'
      - 'hachimi*/**'
      - '.github/workflows/hachimi-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 取 APK
        run: |
          : > status.log
          echo "READY=false" >> $GITHUB_ENV
          echo "run: $GITHUB_RUN_ID ($GITHUB_SHA)  $(date -u +%FT%TZ)" >> status.log
          APK=$(find apk-* -maxdepth 2 -name '*.apk' -type f 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then
            mkdir -p apk-dl
            gh release download -R "$GITHUB_REPOSITORY" -D apk-dl --pattern '*.apk' --clobber >> status.log 2>&1 || true
            APK=$(find apk-dl -name '*.apk' 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then echo "结果: 跳过（无 APK）" >> status.log; exit 0; fi
          echo "APK: $APK ($(stat -c%s "$APK") B)" >> status.log
          echo "APK=$APK" >> $GITHUB_ENV

      - name: 取 Hachimi proxy 库
        run: |
          mkdir -p libs
          for R in kairusds/Hachimi-Edge Hachimi-Hachimi/Hachimi; do
            echo "--- $R" >> status.log
            gh release download -R "$R" -D "libs/$(echo $R | tr / _)" --pattern '*' --clobber >> status.log 2>&1 || true
          done
          for f in libs/*/* ; do
            [ -f "$f" ] || continue
            case "$f" in
              *.zip) unzip -o -q "$f" -d "$(dirname "$f")/unpack" 2>/dev/null || true ;;
              *.tar.gz|*.tgz) tar xzf "$f" -C "$(dirname "$f")" 2>/dev/null || true ;;
            esac
          done
          echo "候选 .so:" >> status.log
          find libs -iname '*.so' 2>/dev/null | head -40 >> status.log || true
          P64=$(find libs -iname 'libmain-arm64-v8a.so' 2>/dev/null | head -1 || true)
          [ -z "$P64" ] && P64=$(find libs -iname 'libmain*.so' 2>/dev/null | head -1 || true)
          HSO=$(find libs -iname 'libhachi*.so' 2>/dev/null | head -1 || true)
          echo "proxy(arm64): ${P64:-<无>}" >> status.log
          echo "libhachimi  : ${HSO:-<无>}" >> status.log
          echo "P64=$P64" >> $GITHUB_ENV
          echo "HSO=$HSO" >> $GITHUB_ENV
          if [ -z "$P64" ]; then echo "结果: 跳过（无 proxy 库）" >> status.log; exit 0; fi
          echo "READY=true" >> $GITHUB_ENV

      - name: 注入
        if: env.READY == 'true'
        run: |
          set -e
          rm -rf work out && mkdir -p work out
          unzip -q "$APK" -d work
          ls work/lib/ >> status.log 2>&1 || true
          N=0
          for d in work/lib/*/ ; do
            [ -f "$d/libmain.so" ] || continue
            ABI=$(basename "$d")
            PROXY=$(find libs -iname "libmain-${ABI}.so" 2>/dev/null | head -1 || true)
            [ -z "$PROXY" ] && [ "$ABI" = "arm64-v8a" ] && PROXY="$P64"
            if [ -z "$PROXY" ]; then echo "  $ABI: 无 proxy，跳过" >> status.log; continue; fi
            mv "$d/libmain.so" "$d/libmain_orig.so"
            cp "$PROXY" "$d/libmain.so"
            [ -n "${HSO:-}" ] && cp "$HSO" "$d/$(basename "$HSO")"
            echo "  $ABI: libmain.so -> libmain_orig.so, proxy=$(basename "$PROXY")" >> status.log
            N=$((N+1))
          done
          if [ "$N" = "0" ]; then echo "::error::没有 ABI 注入成功"; exit 1; fi
          echo "注入 ABI 数: $N" >> status.log
          ls -l work/lib/*/ >> status.log 2>&1 || true

      - name: 打包 + 对齐 + 签名
        if: env.READY == 'true'
        run: |
          set -e
          ( cd work && zip -q -r -n .arsc:.so ../out/app-unsigned.apk . )
          ZA=$(ls "$ANDROID_HOME"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1)
          AS=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          "$ZA" -p -f 4 out/app-unsigned.apk out/app-aligned.apk
          "$ZA" -c -p 4 out/app-aligned.apk > /dev/null && echo "zipalign: ok" >> status.log
          keytool -genkeypair -v -keystore dsh.keystore -alias dsh -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass dshpass -keypass dshpass \
            -dname "CN=DSH,OU=Uma,O=DSH,L=NA,S=NA,C=JP" > /dev/null 2>&1
          NAME=$(basename "$APK" .apk)
          "$AS" sign --ks dsh.keystore --ks-pass pass:dshpass --key-pass pass:dshpass \
            --v2-signing-enabled true --v3-signing-enabled true \
            --out "out/${NAME}-hachimi.apk" out/app-aligned.apk
          "$AS" verify "out/${NAME}-hachimi.apk" > /dev/null && echo "签名: ok" >> status.log
          {
            echo "输出: out/${NAME}-hachimi.apk ($(stat -c%s "out/${NAME}-hachimi.apk") B)"
            echo "sha256: $(sha256sum "out/${NAME}-hachimi.apk" | cut -d' ' -f1)"
            echo "结果: 成功"
          } >> status.log
          echo "OUT_APK=out/${NAME}-hachimi.apk" >> $GITHUB_ENV

      - name: 上传 artifact
        if: env.READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hachimi-patched-apk
          path: ${{ env.OUT_APK }}
          retention-days: 14
          compression-level: 0

      - name: 提交状态
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f status.log ] || echo "(无状态)" > status.log
          cp status.log hachimi-apk-status.txt
          git add hachimi-apk-status.txt
          git commit -m "ci: hachimi-apk status ($GITHUB_RUN_ID)" || echo "no change"
          git push || true